[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "any-tv-art"
version = "0.1.0"
description = "The TV you already own, as a matted picture on the wall: Google TV, Android TV and Samsung Art Mode, with or without a computer at home."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "samsungtvws @ https://github.com/NickWaterton/samsung-tv-ws-api/archive/fe95ef1d784cd32f49bf9a07ec479576574eea07.zip",
  "Pillow>=10.0",
  "icalendar>=5.0",
  "recurring-ical-events>=2.1",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]

[project.scripts]
anytvart = "anytvart.cli:main"

[tool.setuptools]
packages = ["anytvart", "anytvart.drivers"]

[tool.setuptools.package-data]
anytvart = ["fonts/*.ttf", "fonts/*.txt"]
